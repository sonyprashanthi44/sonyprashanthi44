<svg width="520" height="240" viewBox="0 0 520 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bank Complaint Analyzer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17122f"/><stop offset="1" stop-color="#0e0b20"/></linearGradient>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <clipPath id="cp"><rect x="2" y="2" width="516" height="236" rx="20"/></clipPath>
</defs>
<style>
  .chip { opacity: 0; animation: fade .6s ease-out forwards; }
  .t { opacity: 0; animation: slide .8s .15s ease-out forwards; }
  .d { opacity: 0; animation: slide .8s .3s ease-out forwards; }
  .ring { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
  .glow { animation: glow 3.2s ease-in-out infinite; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slide { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: .7; } }
</style>
<g clip-path="url(#cp)">
  <rect width="520" height="240" fill="url(#bg)"/>
  <circle class="glow" cx="470" cy="40" r="90" fill="#60a5fa" filter="url(#blur)"/>
  <rect x="0" y="0" width="520" height="6" fill="url(#bar)"/>
  <rect x="-200" y="0" width="200" height="6" fill="#fff" opacity="0.6"><animate attributeName="x" values="-200;520" dur="3.5s" repeatCount="indefinite"/></rect>
  <!-- decorative orbit icon -->
  <g transform="translate(455,60)">
    <circle r="26" fill="none" stroke="#60a5fa" stroke-opacity="0.5" stroke-dasharray="4 6" class="ring"/>
    <circle r="14" fill="none" stroke="#60a5fa" stroke-opacity="0.8"/>
    <circle r="5" fill="#60a5fa"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#fff"><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/><animate attributeName="cx" values="26;26" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <g class="t">
    <rect x="28" y="26" width="98" height="24" rx="12" fill="#60a5fa" fill-opacity="0.18" stroke="#60a5fa" stroke-opacity="0.6"/>
    <text x="77.0" y="42.5" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1" fill="#60a5fa">NLP · RAG</text>
    <text x="28" y="80" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff">Bank Complaint Analyzer</text>
  </g>
  <g class="d">
<text x="28" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#d4c6ee">Classifies bank complaints and drafts evidence-</text>
<text x="28" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#d4c6ee">backed replies grounded in similar past cases.</text>
<text x="28" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#d4c6ee">TF-IDF + LogReg, pgvector retrieval, LLM drafts.</text>
  </g>
<g class="chip" style="animation-delay:0.5s"><rect x="28" y="188" width="42" height="26" rx="13" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.6"/><text x="49.0" y="205" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#f1e9ff">NLP</text></g>
<g class="chip" style="animation-delay:0.62s"><rect x="78" y="188" width="77" height="26" rx="13" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.6"/><text x="116.5" y="205" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#f1e9ff">pgvector</text></g>
<g class="chip" style="animation-delay:0.74s"><rect x="163" y="188" width="70" height="26" rx="13" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.6"/><text x="198.0" y="205" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#f1e9ff">FastAPI</text></g>
<g class="chip" style="animation-delay:0.86s"><rect x="241" y="188" width="77" height="26" rx="13" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.6"/><text x="279.5" y="205" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#f1e9ff">React TS</text></g>
<g class="chip" style="animation-delay:0.98s"><rect x="326" y="188" width="42" height="26" rx="13" fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-opacity="0.6"/><text x="347.0" y="205" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#f1e9ff">LLM</text></g>
</g>
<rect x="2" y="2" width="516" height="236" rx="20" fill="none" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
</svg>
<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Thalari Sony Prashanthi - Senior Python Full Stack Developer and AI/ML Engineer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0b0918"/><stop offset="0.55" stop-color="#1a1236"/><stop offset="1" stop-color="#2b1655"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#f3eaff"/><stop offset="0.5" stop-color="#c9b6e4"/><stop offset="1" stop-color="#f5a8ff"/>
  </linearGradient>
  <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="1" stop-color="#ec4899" stop-opacity="0.45"/></linearGradient>
  <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9b6e4" stop-opacity="0.35"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0.35"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect width="1200" height="340" rx="28"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c9b6e4" stroke-opacity="0.06"/></pattern>
</defs>
<style>
  .name { font: 800 62px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; opacity: 0; animation: rise 1.2s 0.2s ease-out forwards; }
  .role { font: 500 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e4d7f7; letter-spacing: 1.5px; opacity: 0; animation: rise 1.2s 0.7s ease-out forwards; }
  .tag  { font: 600 15px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #d8c8f0; opacity: 0; animation: rise 1.2s 1.1s ease-out forwards; }
  .pill { opacity: 0; animation: rise 1.2s 1.4s ease-out forwards; }
  .sym  { font: 700 34px 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; fill: #c9b6e4; opacity: .18; animation: bob 7s ease-in-out infinite; }
  .pulse { animation: pulse 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.8); opacity: .35; } }
</style>
<g clip-path="url(#round)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="180" cy="90" r="120" fill="#8b5cf6" opacity="0.55" filter="url(#blur)">
    <animate attributeName="cx" values="180;320;180" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;160;90" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="80" r="130" fill="#ec4899" opacity="0.40" filter="url(#blur)">
    <animate attributeName="cx" values="1000;860;1000" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;170;80" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="300" r="110" fill="#c9b6e4" opacity="0.30" filter="url(#blur)">
    <animate attributeName="cx" values="620;760;620" dur="18s" repeatCount="indefinite"/>
  </circle>
  <!-- floating code symbols -->
  <text class="sym" x="70"  y="120" style="animation-delay:0s">&lt;/&gt;</text>
  <text class="sym" x="1080" y="140" style="animation-delay:1.5s">{ }</text>
  <text class="sym" x="150" y="260" style="animation-delay:3s">AI</text>
  <text class="sym" x="1010" y="270" style="animation-delay:2.2s">py</text>
  <text class="sym" x="940" y="60"  style="animation-delay:4s">λ</text>
  <text class="sym" x="250" y="50"  style="animation-delay:5s">ML</text>
  <!-- twinkling particles -->
  <g fill="#fff">
    <circle cx="300" cy="60" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="35" r="1.6"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="55" r="2.2"><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="190" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="190" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="40" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="215" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <!-- text -->
  <text class="name" x="600" y="140" text-anchor="middle" fill="url(#name)" filter="url(#glow)">Thalari Sony Prashanthi</text>
  <text class="role" x="600" y="186" text-anchor="middle">Senior Python Full Stack Developer  ·  AI / ML Engineer</text>
  <text class="tag" x="600" y="222" text-anchor="middle">Django · FastAPI · React · AWS · LLM &amp; RAG  —  Banking · Insurance · Retail</text>
  <g class="pill">
    <rect x="420" y="240" width="360" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#c9b6e4" stroke-opacity="0.5"/>
    <circle class="pulse" cx="446" cy="257" r="5" fill="#4ade80"/>
    <text x="466" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="600" fill="#f1e9ff">Open to AI/ML · Full-Stack Python roles</text>
  </g>
  <!-- waves -->
  <g>
    <path fill="url(#wave2)" d="M0 300 q150 -50 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V340 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path fill="url(#wave1)" d="M0 315 q150 -40 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V340 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>
</g>
<rect x="1" y="1" width="1198" height="338" rx="27" fill="none" stroke="#c9b6e4" stroke-opacity="0.35"/>
</svg>
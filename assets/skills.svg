  <rect x="2" y="2" width="316" height="6" rx="3" fill="#a78bfa" opacity="0.9"/>
  <circle cx="30" cy="40" r="6" fill="#a78bfa"><animate attributeName="r" values="5;8;5" dur="2.4s" begin="0.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.5;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
  <text x="48" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#f5eeff">Python &amp; Backend</text>
  <line x1="24" y1="62" x2="296" y2="62" stroke="#a78bfa" stroke-opacity="0.25"/>
  <text x="26" y="96" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d9ccf2"><tspan fill="#a78bfa">›</tspan> Django · DRF · FastAPI · Flask</text>
  <text x="26" y="126" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#d9ccf2"><tspan fill="#a78bfa">›</tspan> Celery · Pydantic · SQLAlchemy</text>

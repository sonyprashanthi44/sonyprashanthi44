<svg width="1000" height="390" viewBox="0 0 1000 390" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Skills grouped by area">
<style>
  .card { opacity: 0; transform-box: fill-box; transform-origin: center; animation: up .8s ease-out forwards, float 6s ease-in-out 1.2s infinite; }
  @keyframes up { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
</style>
<g transform="translate(0,0)"><g class="card" style="animation-delay:0.0s">

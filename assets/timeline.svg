<svg width="1000" height="610" viewBox="0 0 1000 610" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Career timeline">
<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="0.35" stop-color="#f472b6"/><stop offset="0.7" stop-color="#60a5fa"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
<style>
  .draw { animation: draw 2.4s .2s ease-out forwards; }
  .item { opacity: 0; animation: in .8s ease-out forwards; }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes in { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(2.6); opacity: 0; } }
</style>
